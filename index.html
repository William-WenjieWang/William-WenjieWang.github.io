    .cover-sequence {

      height: var(--cover-sequence-height, 585svh);
      min-height: 100svh;
      background: #000;
    }
    .cover-sequence-sticky {
      position: sticky;
      top: 0;
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
      background: #000;
    }
    .cover-slides {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .cover-sequence-sticky.cover-slides {
      position: sticky;
      top: 0;
      height: 100svh;
      min-height: 100svh;
    }
    .cover-slide {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      overflow: hidden;
      color: #fff;
      background: #000;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8%);
      transition: opacity 260ms ease-out, transform 260ms ease-out, visibility 0s linear 260ms;
      visibility: hidden;
    }
    .cover-slide.active {
      z-index: 2;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      transition: opacity 260ms ease-out, transform 260ms ease-out;
      visibility: visible;
    }
    .cover-slide.previous {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8%);
      visibility: hidden;
    }
    .cover-slide.next {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8%);
      visibility: hidden;
    }
    .cover-slide-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
      transition: transform 260ms ease-out;
    }
    .cover-slide.active .cover-slide-image {
      transform: scale(1);
    }
    .cover-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.24), rgba(0, 0, 0, 0.1) 42%, rgba(0, 0, 0, 0.38));
      pointer-events: none;
    }
    .cover-slide-title,
    .cover-slide-index {

      z-index: 2;
      color: rgba(255, 255, 255, 0.86);

    .cover-slide-title {

      bottom: 1.45rem;

      line-height: 1.45;
      text-align: left;
      transform: translateY(8px);

    .cover-slide-index {

      font-size: 0.72rem;

    .cover-slide:hover .cover-slide-title,
    .cover-slide:hover .cover-slide-index,

      opacity: 1;
      transform: translateY(0);

      width: 100%;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: #0b0b0b;
      aspect-ratio: 16 / 9;
      cursor: pointer;

      display: block;
      width: 100%;
      height: 100%;

      opacity: 1;
      transform: scale(1);

      align-items: center;
      justify-content: center;

      font-weight: 600;

    <div class="video-modal-panel" role="document">
      <div class="video-modal-top">
        <p class="video-modal-title" id="videoModalTitle">Work</p>
        <button class="video-modal-close" type="button" aria-label="关闭视频">×</button>
      </div>
      <div class="video-modal-frame" id="videoModalFrame"></div>
    </div>
  </div>

  <!-- Footer -->

    Made with ❤️ and a camera.
  </footer>

  <script>
    AOS.init({ once: true });

    const videoProjects = Array.from(document.getElementsByClassName('video-project'));
    const videoModal = document.getElementById('videoModal');
    const videoModalFrame = document.getElementById('videoModalFrame');
    const videoModalTitle = document.getElementById('videoModalTitle');
    const videoModalClose = document.querySelector('.video-modal-close');
    const coverSequence = document.querySelector('.cover-sequence');
    const coverSlides = Array.from(document.getElementsByClassName('cover-slide'));
    let lastVideoTrigger = null;
    let activeCoverIndex = -1;
    let coverRaf = 0;

    const clearModalVideo = () => {
      if (videoModalFrame) {
        videoModalFrame.innerHTML = '';
      }
    };

    const closeVideoModal = () => {
      if (!videoModal) {
        return;
      }

      clearModalVideo();
      videoModal.classList.remove('active');
      videoModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');

      if (lastVideoTrigger) {
        lastVideoTrigger.focus();
      }
    };

    const openVideoModal = (project, trigger) => {
      const embedUrl = project.dataset.videoSrc;
      const title = project.dataset.videoTitle || 'Work';

      if (!embedUrl) {
        Array.from(project.getElementsByClassName('video-trigger')).forEach((item) => {
          item.setAttribute('disabled', 'disabled');
          item.setAttribute('aria-disabled', 'true');
        });
        return;
      }

      lastVideoTrigger = trigger;
      clearModalVideo();
      videoModalTitle.textContent = title;

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.setAttribute('frameborder', '0');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('loading', 'lazy');
      iframe.title = title;

      videoModalFrame.appendChild(iframe);
      videoModal.classList.add('active');
      videoModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      videoModalClose.focus();
    };

    const isPinnedCoverSequence = () => {
      return Boolean(coverSequence && coverSlides.length);
    };

    const setCoverIndex = (nextIndex) => {
      const index = Math.max(0, Math.min(coverSlides.length - 1, nextIndex));

      if (index === activeCoverIndex) {
        return;
      }

      activeCoverIndex = index;
      coverSlides.forEach((slide, slideIndex) => {
        slide.classList.toggle('active', slideIndex === index);
        slide.classList.toggle('previous', slideIndex < index);
        slide.classList.toggle('next', slideIndex > index);
      });

    };

    const syncCoverSequenceHeight = () => {
      if (!coverSequence || !coverSlides.length) {
        return;
      }

      coverSequence.style.setProperty('--cover-sequence-height', `${coverSlides.length * 65}svh`);
      coverSequence.style.setProperty('--cover-sequence-height-dvh', `${coverSlides.length * 65}dvh`);
      coverSequence.style.setProperty('--cover-sequence-height-mobile', `${coverSlides.length * 62}svh`);
    };

    const updateCoverSequence = () => {
      coverRaf = 0;

      if (!coverSequence || !coverSlides.length) {
        return;
      }

      if (!isPinnedCoverSequence()) {
        setCoverIndex(0);
        return;
      }

      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 1;
      const sequenceTop = coverSequence.getBoundingClientRect().top;
      const maxPinnedScroll = Math.max(1, coverSequence.offsetHeight - viewportHeight);
      const sequenceScroll = Math.min(Math.max(-sequenceTop, 0), maxPinnedScroll);
      const slideLength = Math.max(1, coverSlides.length - 1);
      const nextIndex = Math.round((sequenceScroll / maxPinnedScroll) * slideLength);

      setCoverIndex(nextIndex);
    };

    const requestCoverUpdate = () => {
      if (coverRaf) {
        return;
      }

      coverRaf = window.requestAnimationFrame(updateCoverSequence);
    };

    videoProjects.forEach((project) => {
      if (!project.dataset.videoSrc) {
        Array.from(project.getElementsByClassName('video-trigger')).forEach((trigger) => {
          trigger.setAttribute('disabled', 'disabled');
          trigger.setAttribute('aria-disabled', 'true');
        });
      }

      Array.from(project.getElementsByClassName('video-trigger')).forEach((trigger) => {
        trigger.addEventListener('click', () => {
          openVideoModal(project, trigger);
        });
      });
    });

    coverSlides.forEach((slide) => {
      slide.addEventListener('click', () => {
        const projectIndex = Number(slide.dataset.coverProject);
        const project = videoProjects[projectIndex];

        if (project) {
          openVideoModal(project, slide);
        }
      });
    });

    syncCoverSequenceHeight();
    setCoverIndex(0);
    window.addEventListener('scroll', requestCoverUpdate, { passive: true });
    window.addEventListener('resize', () => {
      syncCoverSequenceHeight();
      requestCoverUpdate();
    });
    window.addEventListener('orientationchange', () => {
      syncCoverSequenceHeight();
      requestCoverUpdate();
    });
    requestCoverUpdate();

    document.querySelectorAll('.video-poster').forEach((poster) => {
      poster.addEventListener('error', () => {
        poster.removeAttribute('src');
        poster.setAttribute('aria-hidden', 'true');
        poster.closest('.video-tile-media')?.classList.add('is-poster-missing');
      });
    });

    videoModalClose?.addEventListener('click', closeVideoModal);

    videoModal?.addEventListener('click', (event) => {
      if (event.target === videoModal) {
        closeVideoModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && videoModal?.classList.contains('active')) {
        closeVideoModal();
      }
    });
  </script>
