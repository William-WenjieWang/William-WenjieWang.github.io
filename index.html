<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#FF7D00',
            dark: '#000000',
            light: '#F5F5F5'
          },
          fontFamily: {
            display: ['Manrope', 'sans-serif'],
            sans: ['Manrope', 'sans-serif']
          },

  <style>
    body {
      scroll-behavior: smooth;
    }
    .portfolio-wall {
      padding: 6rem 0.75rem 0.75rem;
      background: #000;
    }
    .video-wall-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .video-tile {
      position: relative;
      overflow: hidden;
      background: #050505;
      min-width: 0;
    }
    .video-tile-media {
      position: relative;
      display: block;
      width: 100%;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: #0b0b0b;
      aspect-ratio: 16 / 9;
      cursor: pointer;
    }
    .video-poster {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      transform: scale(1);
      transition: transform 420ms ease, opacity 360ms ease;
    }
    .video-tile-media.is-poster-missing .video-poster {
      opacity: 0;
    }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.38);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      background: #050505;
    }
    .video-title-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: clamp(1rem, 1.6vw, 1.45rem);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.35;
      opacity: 0;
      text-align: center;
      transform: translateY(8px);
      transition: opacity 360ms ease, transform 360ms ease;
    }
    .video-tile-media:hover .video-poster,
    .video-tile-media:focus-visible .video-poster {
      transform: scale(1.025);
    }
    .video-tile-media:hover .video-title-overlay,
    .video-tile-media:focus-visible .video-title-overlay {
      opacity: 1;
      transform: translateY(0);
    }
    .video-tile-media:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.7);
      outline-offset: 3px;
    }
    body.modal-open {
      overflow: hidden;
    }
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: rgba(0, 0, 0, 0.86);
    }
    .video-modal.active {
      display: flex;
    }
    .video-modal-panel {
      width: min(1040px, 100%);
    }
    .video-modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }
    .video-modal-title {
      min-width: 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .video-modal-close {
      flex: 0 0 auto;
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
      font-size: 1.35rem;
      line-height: 1;
      transition: border-color 220ms ease, background 220ms ease;
    }
    .video-modal-close:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }
    .video-modal-frame {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0;
      background: #050505;
      aspect-ratio: 16 / 9;
    }
    .video-modal-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    @media (min-width: 1180px) {
      .video-wall-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 768px) {
      html,
      body {
        overflow-x: hidden;
        background: #000;
      }
      header.fixed {
        padding: 0.85rem 1rem;
        background: rgba(0, 0, 0, 0.18);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      header .space-x-8 > :not([hidden]) ~ :not([hidden]) {
        margin-left: 1.2rem;
      }
      header a {
        font-size: 0.68rem;
        letter-spacing: 0.12em;
      }
      header .gap-6 {
        gap: 0.85rem;
      }
      header .text-xl {
        font-size: 0.92rem;
        opacity: 0.62;
      }
      #home {
        width: 100%;
        height: 100svh;
        min-height: 100svh;
        max-height: 100svh;
        overflow: hidden;
      }
      #home video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .portfolio-wall {
        padding: 0 0 0.625rem;
      }
      .video-wall-grid {
        grid-template-columns: 1fr;
        gap: 10px;
        width: 100%;
        padding-left: 0;
        padding-right: 0;
      }
      .video-tile {
        width: 100%;
        border-radius: 0;
        background: #000;
      }
      .video-tile-media {
        width: 100%;

        background: #000;
        aspect-ratio: 16 / 9;
      }
      .video-title-overlay {
        padding: 1rem;
        background: rgba(0, 0, 0, 0.28);
        font-size: 0.95rem;
      }
      .video-modal {
        padding: 0.75rem;
      }
      .video-modal-close {
        width: 2.5rem;
        height: 2.5rem;
        background: transparent;
      }
    }
  </style>
</head>

  <script>
    AOS.init({ once: true });

    const videoProjects = Array.from(document.getElementsByClassName('video-project'));
    const videoModal = document.getElementById('videoModal');
    const videoModalFrame = document.getElementById('videoModalFrame');
    const videoModalTitle = document.getElementById('videoModalTitle');
    const videoModalClose = document.querySelector('.video-modal-close');
    let lastVideoTrigger = null;

    const clearModalVideo = () => {
      if (videoModalFrame) {
        videoModalFrame.innerHTML = '';
      }
    };

    const closeVideoModal = () => {
      if (!videoModal) {
        return;
      }

      clearModalVideo();
      videoModal.classList.remove('active');
      videoModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');

      if (lastVideoTrigger) {
        lastVideoTrigger.focus();
      }
    };

    const openVideoModal = (project, trigger) => {
      const embedUrl = project.dataset.videoSrc;
      const title = project.dataset.videoTitle || 'Work';

      if (!embedUrl) {
        Array.from(project.getElementsByClassName('video-trigger')).forEach((item) => {
          item.setAttribute('disabled', 'disabled');
          item.setAttribute('aria-disabled', 'true');
        });
        return;
      }

      lastVideoTrigger = trigger;
      clearModalVideo();
      videoModalTitle.textContent = title;

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.setAttribute('frameborder', '0');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('loading', 'lazy');
      iframe.title = title;

      videoModalFrame.appendChild(iframe);
      videoModal.classList.add('active');
      videoModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      videoModalClose.focus();
    };

    videoProjects.forEach((project) => {
      if (!project.dataset.videoSrc) {
        Array.from(project.getElementsByClassName('video-trigger')).forEach((trigger) => {
          trigger.setAttribute('disabled', 'disabled');
          trigger.setAttribute('aria-disabled', 'true');
        });
      }

      Array.from(project.getElementsByClassName('video-trigger')).forEach((trigger) => {
        trigger.addEventListener('click', () => {
          openVideoModal(project, trigger);
        });
      });
    });

    document.querySelectorAll('.video-poster').forEach((poster) => {
      poster.addEventListener('error', () => {
        poster.removeAttribute('src');
        poster.setAttribute('aria-hidden', 'true');
        poster.closest('.video-tile-media')?.classList.add('is-poster-missing');
      });
    });

    videoModalClose?.addEventListener('click', closeVideoModal);

    videoModal?.addEventListener('click', (event) => {
      if (event.target === videoModal) {
        closeVideoModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && videoModal?.classList.contains('active')) {
        closeVideoModal();
      }
    });
  </script>
